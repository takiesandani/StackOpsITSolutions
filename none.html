<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Padlock Scroll Object</title>
  <meta name="description" content="Single premium scroll-controlled cyber padlock animation." />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js",
        "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/ScrollTrigger.js"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    body { min-height: 420vh; }

    .padlock-scroll-hero {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #padlockCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <section class="padlock-scroll-hero" id="padlockHero" aria-label="Scroll controlled cyber padlock animation">
      <canvas id="padlockCanvas"></canvas>
    </section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { gsap } from "gsap";
    import { ScrollTrigger } from "gsap/ScrollTrigger";

    gsap.registerPlugin(ScrollTrigger);

    const hero = document.getElementById("padlockHero");
    const canvas = document.getElementById("padlockCanvas");

    const COLORS = {
      metal: 0x050608,
      metalFace: 0x090d12,
      bevel: 0x182231,
      blue: 0x48d8ff,
      deepBlue: 0x076eff
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera.position.set(0, 0, 6.4);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const lock = new THREE.Group();
    lock.position.y = -.08;
    scene.add(lock);

    const parts = [];
    const state = { split: 0, glow: .7 };

    function roundedRect(width, height, radius) {
      const x = -width / 2;
      const y = -height / 2;
      const shape = new THREE.Shape();
      shape.moveTo(x + radius, y);
      shape.lineTo(x + width - radius, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + radius);
      shape.lineTo(x + width, y + height - radius);
      shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      shape.lineTo(x + radius, y + height);
      shape.quadraticCurveTo(x, y + height, x, y + height - radius);
      shape.lineTo(x, y + radius);
      shape.quadraticCurveTo(x, y, x + radius, y);
      return shape;
    }

    function remember(group, splitPosition, splitRotation) {
      group.userData.homePosition = group.position.clone();
      group.userData.homeRotation = group.rotation.clone();
      group.userData.splitPosition = new THREE.Vector3(splitPosition.x, splitPosition.y, splitPosition.z);
      group.userData.splitRotation = new THREE.Euler(splitRotation.x, splitRotation.y, splitRotation.z);
      parts.push(group);
      lock.add(group);
      return group;
    }

    const blackMetal = new THREE.MeshPhysicalMaterial({
      color: COLORS.metal,
      roughness: .28,
      metalness: .92,
      clearcoat: .75,
      clearcoatRoughness: .2,
      reflectivity: .62
    });

    const frontMetal = new THREE.MeshPhysicalMaterial({
      color: COLORS.metalFace,
      roughness: .22,
      metalness: .88,
      clearcoat: .85,
      clearcoatRoughness: .14,
      reflectivity: .7
    });

    const bevelMetal = new THREE.MeshStandardMaterial({
      color: COLORS.bevel,
      emissive: COLORS.deepBlue,
      emissiveIntensity: .08,
      roughness: .2,
      metalness: .86
    });

    const glowMaterial = new THREE.MeshBasicMaterial({
      color: COLORS.blue,
      transparent: true,
      opacity: .92
    });

    const glowLine = new THREE.LineBasicMaterial({
      color: COLORS.blue,
      transparent: true,
      opacity: .46
    });

    // 1. Back lock body.
    const backBody = remember(new THREE.Group(), { x: 0, y: 0, z: -.34 }, { x: 0, y: .1, z: 0 });
    const backGeometry = new THREE.ExtrudeGeometry(roundedRect(1.72, 1.36, .22), {
      depth: .46,
      bevelEnabled: true,
      bevelSize: .055,
      bevelThickness: .07,
      bevelSegments: 10,
      curveSegments: 24
    });
    backGeometry.center();
    const backMesh = new THREE.Mesh(backGeometry, blackMetal);
    backMesh.position.y = -.38;
    backBody.add(backMesh);

    // 2. Front lock face.
    const frontFace = remember(new THREE.Group(), { x: 0, y: -.01, z: .34 }, { x: 0, y: -.08, z: 0 });
    const faceGeometry = new THREE.ExtrudeGeometry(roundedRect(1.54, 1.18, .18), {
      depth: .13,
      bevelEnabled: true,
      bevelSize: .035,
      bevelThickness: .045,
      bevelSegments: 8,
      curveSegments: 22
    });
    faceGeometry.center();
    const faceMesh = new THREE.Mesh(faceGeometry, frontMetal);
    faceMesh.position.set(0, -.38, .25);
    frontFace.add(faceMesh);

    const faceRimGeometry = new THREE.EdgesGeometry(faceGeometry, 20);
    const faceRim = new THREE.LineSegments(faceRimGeometry, new THREE.LineBasicMaterial({ color: COLORS.blue, transparent: true, opacity: .2 }));
    faceRim.position.copy(faceMesh.position);
    frontFace.add(faceRim);

    // 3. Shackle.
    const shackle = remember(new THREE.Group(), { x: 0, y: .34, z: .12 }, { x: -.08, y: .08, z: 0 });
    const shackleMesh = new THREE.Mesh(new THREE.TorusGeometry(.58, .09, 22, 128, Math.PI), bevelMetal);
    shackleMesh.rotation.z = Math.PI;
    shackleMesh.scale.y = 1.35;
    shackleMesh.position.set(0, .26, 0);
    shackle.add(shackleMesh);

    const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .72, 24), bevelMetal);
    leftPost.position.set(-.58, -.16, 0);
    const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .72, 24), bevelMetal);
    rightPost.position.set(.58, -.16, 0);
    shackle.add(leftPost, rightPost);

    // 4. Glowing inner core.
    const innerCore = remember(new THREE.Group(), { x: 0, y: -.02, z: .48 }, { x: 0, y: 0, z: 0 });
    const keyholeTop = new THREE.Mesh(new THREE.CircleGeometry(.125, 48), glowMaterial);
    keyholeTop.position.set(0, -.26, .36);
    const keyholeStem = new THREE.Mesh(new THREE.PlaneGeometry(.105, .34), glowMaterial);
    keyholeStem.position.set(0, -.47, .365);
    innerCore.add(keyholeTop, keyholeStem);

    const circuitGroup = new THREE.Group();
    const circuitPaths = [
      [[-.58, -.05, .37], [-.28, -.05, .37], [-.18, -.18, .37]],
      [[.58, -.05, .37], [.28, -.05, .37], [.18, -.18, .37]],
      [[-.48, -.72, .37], [-.2, -.62, .37], [-.12, -.5, .37]],
      [[.48, -.72, .37], [.2, -.62, .37], [.12, -.5, .37]],
      [[-.42, .05, .37], [-.18, .14, .37], [0, .02, .37]],
      [[.42, .05, .37], [.18, .14, .37], [0, .02, .37]]
    ];

    for (const path of circuitPaths) {
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(path.map(([x, y, z]) => new THREE.Vector3(x, y, z))), glowLine);
      circuitGroup.add(line);
    }
    innerCore.add(circuitGroup);

    const rimLight = new THREE.DirectionalLight(COLORS.blue, 3.3);
    rimLight.position.set(-3.5, 2.8, 4.4);
    const fillLight = new THREE.PointLight(COLORS.blue, 3.4, 10);
    fillLight.position.set(0, .5, 3.4);
    const glintLight = new THREE.DirectionalLight(0xffffff, .72);
    glintLight.position.set(2.4, 3.2, 5);
    scene.add(new THREE.AmbientLight(0x243043, .3), rimLight, fillLight, glintLight);

    // Replace this placeholder with a real Blender GLB later.
    // Put the file at public/models/cyber-padlock.glb in a Vite project,
    // load it with GLTFLoader, then map the GLB meshes into these same four groups:
    // frontFace, backBody, shackle, and innerCore.

    const timeline = gsap.timeline({
      scrollTrigger: {
        trigger: hero,
        start: "top top",
        end: "+=320%",
        pin: true,
        scrub: 1.1,
        anticipatePin: 1
      }
    });

    timeline
      .to(camera.position, { z: 4.7, duration: .3, ease: "power2.out" }, 0)
      .to(state, { glow: 1.25, duration: .3, ease: "power2.out" }, 0)
      .to(state, { split: 1, glow: 1.65, duration: .45, ease: "power2.inOut" }, .3)
      .to(camera.position, { z: 3.65, duration: .45, ease: "power2.inOut" }, .3)
      .to(state, { split: 1, duration: .25, ease: "none" }, .75)
      .to(state, { split: 0, glow: 2.1, duration: .25, ease: "power2.inOut" }, 1)
      .to(camera.position, { z: 2.15, duration: .25, ease: "power2.inOut" }, 1);

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    window.addEventListener("resize", resize);
    resize();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      const split = state.split;

      lock.rotation.y = Math.sin(time * .24) * .16 + time * .045;
      lock.rotation.x = Math.sin(time * .18) * .025;
      lock.scale.setScalar(1.42 + (6.4 - camera.position.z) * .095);

      for (const part of parts) {
        part.position.lerpVectors(part.userData.homePosition, part.userData.splitPosition, split);
        part.rotation.x = THREE.MathUtils.lerp(part.userData.homeRotation.x, part.userData.splitRotation.x, split);
        part.rotation.y = THREE.MathUtils.lerp(part.userData.homeRotation.y, part.userData.splitRotation.y, split);
        part.rotation.z = THREE.MathUtils.lerp(part.userData.homeRotation.z, part.userData.splitRotation.z, split);
      }

      glowMaterial.opacity = .76 + Math.sin(time * 2.4) * .08;
      glowLine.opacity = .25 + split * .28 + Math.sin(time * 1.7) * .06;
      fillLight.intensity = 2.1 + state.glow * 1.45;
      camera.lookAt(0, -.2, 0);
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
